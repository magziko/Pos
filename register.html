<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إنشاء حساب — نظام نقاط البيع</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .login-screen {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(circle at 15% 15%, var(--teal-100) 0%, transparent 45%),
      var(--bg);
  }

  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 36px 32px 32px;
    border: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .brand-mark {
    width: 42px; height: 42px;
    border-radius: var(--radius-md);
    background: var(--teal-700);
    display: grid; place-items: center;
    color: white; font-weight: 900; font-size: 18px;
    font-family: var(--font-num);
    flex-shrink: 0;
  }
  .brand-text h1 { font-size: 16px; margin: 0; font-weight: 700; }
  .brand-text p { font-size: 12.5px; color: var(--ink-soft); margin: 2px 0 0; }

  .notice {
    background: var(--amber-100);
    color: var(--amber-600);
    font-size: 12.5px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    font-size: 14.5px;
  }
  .field input[type="email"] { direction: ltr; text-align: right; }
  .field-hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }

  .submit-btn {
    width: 100%;
    background: var(--teal-700);
    color: white;
    padding: 13px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 700;
    margin-top: 6px;
    transition: background 0.15s ease;
  }
  .submit-btn:hover { background: var(--teal-900); }
  .submit-btn:disabled { background: #A9B5AF; cursor: not-allowed; }

  .error-msg, .success-msg {
    font-size: 13px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
    display: none;
    line-height: 1.6;
  }
  .error-msg { background: var(--danger-100); color: var(--danger); }
  .success-msg { background: var(--teal-100); color: var(--teal-900); }
  .error-msg.show, .success-msg.show { display: block; }

  .footnote {
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 20px;
  }
  .footnote a { color: var(--teal-700); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-text">
        <h1>إنشاء حساب جديد</h1>
        <p>أول حساب هيتعمل هيكون أدمن تلقائيًا</p>
      </div>
    </div>

    <div class="notice">
      الصفحة دي للإعداد الأولي بس. بعد ما تعمل حسابك، الأفضل تشيلها أو تمنع الوصول ليها، وباقي حسابات الموظفين تتعمل من لوحة التحكم بعد كده.
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="registerForm">
      <div class="field">
        <label for="fullName">الاسم الكامل</label>
        <input type="text" id="fullName" required placeholder="مثال: أحمد محمد">
      </div>
      <div class="field">
        <label for="branchName">اسم الفرع</label>
        <input type="text" id="branchName" required placeholder="مثال: الفرع الرئيسي">
      </div>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" required autocomplete="username" placeholder="name@example.com">
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" required autocomplete="new-password" placeholder="6 أحرف على الأقل" minlength="6">
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">إنشاء الحساب</button>
    </form>

    <p class="footnote">عندك حساب بالفعل؟ <a href="index.html">سجّل الدخول</a></p>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/register.js"></script>

</body>
</html>
