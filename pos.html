<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>شاشة المبيعات — نظام نقاط البيع</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: var(--bg); }

  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* -------- Top bar -------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--teal-900);
    color: white;
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .topbar-brand { font-weight: 700; font-size: 15px; }
  .topbar-branch {
    font-size: 12.5px;
    background: rgba(255,255,255,0.12);
    padding: 4px 10px;
    border-radius: 20px;
  }
  .topbar-right { display: flex; align-items: center; gap: 14px; font-size: 13px; }
  .topbar-clock { font-family: var(--font-num); direction: ltr; opacity: 0.9; }
  .logout-btn {
    background: rgba(255,255,255,0.12);
    color: white;
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.22); }

  /* -------- Main layout: RTL -> cart on the right (start side) -------- */
  .main {
    display: grid;
    grid-template-columns: 1fr 380px;
    overflow: hidden;
  }

  /* -------- Product side -------- */
  .product-side {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 16px 18px;
  }

  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .search-row input {
    flex: 1;
    padding: 12px 16px;
    font-size: 15px;
    border-radius: var(--radius-md);
  }
  .search-row input:focus { border-color: var(--teal-500); }

  .categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 6px;
  }
  .cat-chip {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink-soft);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
  }
  .cat-chip.active {
    background: var(--teal-700);
    border-color: var(--teal-700);
    color: white;
  }

  .product-grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    align-content: start;
    padding-bottom: 12px;
  }

  .product-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px;
    text-align: right;
    transition: border-color 0.12s ease, transform 0.06s ease;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .product-card:hover { border-color: var(--teal-500); }
  .product-card:active { transform: scale(0.98); }

  .product-thumb {
    width: 100%;
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    background: var(--surface-sunken);
    display: grid;
    place-items: center;
    font-size: 26px;
    color: var(--teal-700);
    overflow: hidden;
  }
  .product-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .product-name {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.35;
    min-height: 2.6em;
  }
  .product-price {
    font-family: var(--font-num);
    direction: ltr;
    text-align: right;
    font-weight: 700;
    color: var(--teal-700);
    font-size: 14px;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--ink-soft);
    padding: 60px 20px;
    font-size: 14px;
  }

  /* -------- Cart side -------- */
  .cart-side {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .cart-header {
    padding: 16px 18px 10px;
    border-bottom: 1px solid var(--border);
  }
  .cart-title { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; }
  .customer-select {
    width: 100%;
    padding: 9px 10px;
    font-size: 13px;
  }

  .cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 8px 14px;
  }

  .cart-empty {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 40px 10px;
  }

  .cart-line {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--surface-sunken);
  }
  .cart-line-name { font-size: 13px; font-weight: 500; }
  .cart-line-total {
    font-family: var(--font-num);
    direction: ltr;
    font-weight: 700;
    font-size: 13.5px;
  }
  .cart-line-controls {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .qty-btn {
    width: 24px; height: 24px;
    border-radius: 6px;
    background: var(--surface-sunken);
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    display: grid;
    place-items: center;
  }
  .qty-btn:hover { background: var(--teal-100); color: var(--teal-700); }
  .qty-value {
    font-family: var(--font-num);
    font-size: 13px;
    min-width: 28px;
    text-align: center;
  }
  .unit-price {
    font-family: var(--font-num);
    direction: ltr;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-inline-start: auto;
  }
  .remove-btn {
    color: var(--danger);
    background: none;
    font-size: 12px;
    padding: 2px 6px;
  }

  .cart-footer {
    border-top: 1px solid var(--border);
    padding: 14px 18px 18px;
  }

  .totals-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .totals-row.grand {
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 8px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .totals-row .num { font-weight: 700; }

  .discount-row {
    display: flex;
    gap: 8px;
    margin: 10px 0;
  }
  .discount-row input {
    flex: 1;
    padding: 8px 10px;
    font-size: 12.5px;
    text-align: center;
  }

  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-secondary {
    flex: 1;
    background: var(--surface-sunken);
    color: var(--ink);
    padding: 11px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
  }
  .btn-secondary:hover { background: var(--amber-100); color: var(--amber-600); }

  .checkout-btn {
    width: 100%;
    background: var(--teal-700);
    color: white;
    padding: 14px;
    border-radius: var(--radius-sm);
    font-size: 15.5px;
    font-weight: 700;
    margin-top: 10px;
  }
  .checkout-btn:hover { background: var(--teal-900); }
  .checkout-btn:disabled { background: #A9B5AF; cursor: not-allowed; }

  /* -------- Toast -------- */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: white;
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }

  @media (max-width: 860px) {
    .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .cart-side { border-right: none; border-top: 1px solid var(--border); max-height: 50vh; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-brand">نظام نقاط البيع</div>
      <div class="topbar-branch" id="branchLabel">—</div>
    </div>
    <div class="topbar-right">
      <span id="cashierLabel">—</span>
      <span class="topbar-clock" id="clockLabel">--:--</span>
      <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
    </div>
  </div>

  <div class="main">
    <div class="product-side">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="ابحث بالاسم أو امسح الباركود..." autofocus>
      </div>
      <div class="categories" id="categoriesRow">
        <button class="cat-chip active" data-cat="all">الكل</button>
      </div>
      <div class="product-grid" id="productGrid">
        <div class="empty-state">جاري تحميل الأصناف...</div>
      </div>
    </div>

    <div class="cart-side">
      <div class="cart-header">
        <div class="cart-title">الفاتورة الحالية</div>
        <select class="customer-select" id="customerSelect">
          <option value="">عميل نقدي (بدون تسجيل)</option>
        </select>
      </div>

      <div class="cart-items" id="cartItems">
        <div class="cart-empty">لسه مفيش أصناف مضافة للفاتورة</div>
      </div>

      <div class="cart-footer">
        <div class="totals-row">
          <span>الإجمالي الفرعي</span>
          <span class="num" id="subtotalLabel">0.00</span>
        </div>
        <div class="discount-row">
          <input type="number" id="discountInput" placeholder="خصم (قيمة)" min="0" value="0">
        </div>
        <div class="totals-row grand">
          <span>الإجمالي</span>
          <span class="num" id="totalLabel">0.00</span>
        </div>

        <div class="action-row">
          <button class="btn-secondary" id="holdBtn">تعليق</button>
          <button class="btn-secondary" id="recallBtn">استرجاع (<span id="heldCount">0</span>)</button>
        </div>
        <button class="checkout-btn" id="checkoutBtn" disabled>إتمام البيع</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/supabase-client.js"></script>
<script src="js/pos.js"></script>
</body>
</html>
