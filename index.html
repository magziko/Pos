<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>تسجيل الدخول — نظام نقاط البيع</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .login-screen {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(circle at 15% 15%, var(--teal-100) 0%, transparent 45%),
      var(--bg);
  }

  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 36px 32px 32px;
    border: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .brand-mark {
    width: 42px;
    height: 42px;
    border-radius: var(--radius-md);
    background: var(--teal-700);
    display: grid;
    place-items: center;
    color: white;
    font-weight: 900;
    font-size: 18px;
    font-family: var(--font-num);
    flex-shrink: 0;
  }

  .brand-text h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 700;
  }
  .brand-text p {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 2px 0 0;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    font-size: 14.5px;
  }
  .field input[type="email"] { direction: ltr; text-align: right; }

  .submit-btn {
    width: 100%;
    background: var(--teal-700);
    color: white;
    padding: 13px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 700;
    margin-top: 6px;
    transition: background 0.15s ease;
  }
  .submit-btn:hover { background: var(--teal-900); }
  .submit-btn:disabled { background: #A9B5AF; cursor: not-allowed; }

  .error-msg {
    background: var(--danger-100);
    color: var(--danger);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
    display: none;
  }
  .error-msg.show { display: block; }

  .footnote {
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 22px;
  }
</style>
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-text">
        <h1>نظام نقاط البيع</h1>
        <p>سجّل الدخول للمتابعة</p>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" required autocomplete="username" placeholder="name@example.com">
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">دخول</button>
    </form>

    <p class="footnote">لو نسيت بيانات الدخول، تواصل مع مدير النظام</p>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');

  // لو فيه جلسة شغالة بالفعل، روح على شاشة المبيعات على طول
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = 'pos.html';
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري الدخول...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      errorMsg.textContent = 'بيانات الدخول غير صحيحة، حاول مرة أخرى';
      errorMsg.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'دخول';
      return;
    }

    // تأكد إن للمستخدم ده profile مفعّل قبل ما يدخل
    const profile = await getUserProfile(data.user.id);
    if (!profile || !profile.is_active) {
      errorMsg.textContent = 'الحساب غير مفعّل، تواصل مع مدير النظام';
      errorMsg.classList.add('show');
      await supabaseClient.auth.signOut();
      submitBtn.disabled = false;
      submitBtn.textContent = 'دخول';
      return;
    }

    window.location.href = 'pos.html';
  });
</script>

</body>
</html>
